name: .NET Build and Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: 8.0.x

    - name: Restore dependencies
      run: dotnet restore src/api/RaceDay.WebAPI/RaceDay.WebAPI.csproj

    - name: Build
      run: dotnet build src/api/RaceDay.WebAPI/RaceDay.WebAPI.csproj --no-restore --configuration Release

    - name: Run tests
      run: dotnet test --no-build --verbosity normal
