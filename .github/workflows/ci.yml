name: .NET CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore src/api/RaceDay/RaceDay.slnx

      - name: Build
        run: dotnet build src/api/RaceDay/RaceDay.slnx --configuration Release --no-restore

      - name: Run tests
        run: dotnet test src/api/RaceDay/tests/RaceDay.Tests/RaceDay.Tests.csproj --configuration Release --no-build --verbosity normal
