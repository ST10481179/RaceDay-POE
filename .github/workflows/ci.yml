name: RaceDay API CI

on:
  push:
    branches: [ main, part2-api ]
  pull_request:
    branches: [ main, part2-api ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x

    - name: Restore dependencies
      run: dotnet restore src/api/RaceDay.WebAPI.Tests/RaceDay.WebAPI.Tests.csproj

    - name: Build API and tests
      run: dotnet build src/api/RaceDay.WebAPI.Tests/RaceDay.WebAPI.Tests.csproj --no-restore --configuration Release

    - name: Run tests
      run: dotnet test src/api/RaceDay.WebAPI.Tests/RaceDay.WebAPI.Tests.csproj --no-build --configuration Release --verbosity minimal
