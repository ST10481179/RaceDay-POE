name: .NET CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Restore dependencies
      run: dotnet restore src/api/RaceDay/RaceDay.csproj

    - name: Build
      run: dotnet build src/api/RaceDay/RaceDay.csproj --configuration Release --no-restore

    - name: Run tests
      run: dotnet test src/api/RaceDay/RaceDay.csproj --no-build --verbosity normal
